image: registry.mi.hdm-stuttgart.de/embedded/ws25/kniffel

variables:
  GIT_SUBMODULE_STRATEGY: recursive # Wichtig! Das Pico SDK nutzt Submodule
  PICO_BOARD: pico2                 # WICHTIG: Target für Pico 2 setzen
  BUILD_TYPE: RelWithDebInfo

stages:
  - lint
  - build

# --- Stage 1: Code Qualität ---
linting:
  stage: lint
  script:
    # 1. Formatierung prüfen
    - echo "Prüfe Code-Formatierung..."
    - >
      find src -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror 
      || (echo -e "\n\e[31m FEHLER: Die Formatierung entspricht nicht den Regeln!\e[0m\n --> Bitte führe lokal 'clang-format -i deine_datei.c' aus." && exit 1)

    # 2. Statische Analyse prüfen
    - echo "Starte statische Code-Analyse..."
    - >
      cppcheck --enable=all --inconclusive --error-exitcode=1 src/ 
      || (echo -e "\n\e[31m FEHLER: Cppcheck hat Probleme im Code gefunden!\e[0m\n --> Bitte überprüfe die oben stehenden Logs auf Warnungen." && exit 1)

# --- Stage 2: Kompilieren ---
build_firmware:
  stage: build
  script:
    - mkdir build
    - cd build
    # CMake Konfiguration für Pico 2
    - cmake -DPICO_BOARD=$PICO_BOARD -DCMAKE_BUILD_TYPE=$BUILD_TYPE ..
    - make -j$(nproc)
  artifacts:
    paths:
      - build/*.uf2
      - build/*.elf
      - build/*.map
    expire_in: 1 week