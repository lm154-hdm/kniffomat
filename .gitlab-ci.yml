image: registry.mi.hdm-stuttgart.de/embedded/ws25/kniffel

stages:
  - debug
  - quality
  - build

# Job 0 - Debug
check_tools:
  stage: debug
  allow_failure: false
  script:
    - echo "DEBUG"
    #- echo "CPPCheck Version"
    #- cppcheck --version

    #- echo "CPPCheck Header"
    #- cppcheck --help
    - echo "DEBUG ENDE"
# --- Job 1: Formatierung (Nur Warnung, bricht nicht ab) ---
check_formatting:
  stage: quality
  allow_failure: true
  script:
    - echo "Prüfe Code-Formatierung..."

    - find src -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror

fix_formatting:
  stage: quality
  allow_failure: false
  needs: ["check_formatting"]
  when: "on_failure"
  variables:
    # name of current branch
    CI_COMMIT_BRANCH_NAME: $CI_COMMIT_REF_NAME
  before_script:
    - git config --global user.email "format-bot@pipeline.local"
    - git config --global user.name "Format Bot"
  script:
    - echo "fixing formatting..."
    
    # 1. build url
    - REPO_URL="https://oauth2:${GIT_PUSH_TOKEN}@gitlab.mi.hdm-stuttgart.de/${CI_PROJECT_PATH}.git"
    
    # 2. Branch auschecken
    - git fetch origin $CI_COMMIT_BRANCH_NAME
    - git checkout -B $CI_COMMIT_BRANCH_NAME origin/$CI_COMMIT_BRANCH_NAME
    
    # 3. Formatierung anwenden (ohne --dry-run, mit -i für in-place edit)
    - find src -name "*.c" -o -name "*.h" | xargs clang-format -i
    
    # 4. Prüfen ob sich wirklich was geändert hat
    - |
      if [[ -n $(git status --porcelain) ]]; then
        git add src/
        # [skip ci] to avoid infinite looping
        git commit -m "Auto-fix: Apply clang-format style [skip ci]"
        git push $REPO_URL $CI_COMMIT_BRANCH_NAME
        echo "pushed fix"
      else
        echo "fix unsuccessful"
      fi

# --- Job 2: Statische Analyse (Strikt, bricht Pipeline ab) ---
static_analysis:
  stage: quality
  allow_failure: false # (Standard) Bricht ab, wenn Fehler gefunden werden
  script:
    - echo "Suche nach Bugs..."
    # --error-exitcode=1 sorgt dafür, dass der Job rot wird bei Funden
    - cppcheck --enable=all --inconclusive --suppress=missingInclude --error-exitcode=1 src/

# --- Stage 2: Build (Läuft nur, wenn static_analysis grün ist) ---
build_firmware:
  stage: build
  script:
    - mkdir build
    - cd build
    - cmake -DPICO_BOARD=$PICO_BOARD -DCMAKE_BUILD_TYPE=$BUILD_TYPE ..
    - make -j$(nproc)
  artifacts:
    paths:
      - build/*.uf2
      - build/*.elf
      - build/*.map
    expire_in: 1 week